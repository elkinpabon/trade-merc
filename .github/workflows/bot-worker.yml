name: TRADEMERC ML Trading Bot Worker

on:
  schedule:
    - cron: '17 * * * *'  # Repairs the continuous chain if a dispatch is lost
  workflow_dispatch:        # Manual trigger button
    inputs:
      research_mode:
        description: 'cycle, backfill, backtest o train'
        required: false
        default: 'cycle'
      research_days:
        description: 'Días para backfill o backtest (máximo 90/365)'
        required: false
        default: '30'
      block_cycles:
        description: 'Ciclos de 15 minutos dentro del bloque operativo'
        required: false
        default: '8'

permissions:
  contents: read
  actions: write

jobs:
  run-bot-scan:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.research_mode == 'cycle' || inputs.research_mode == '')
    runs-on: ubuntu-latest
    timeout-minutes: 170
    concurrency:
      group: trademerc-database-writer
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Apply worker reliability migration
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
        run: |
          python backend/scripts/apply_migration.py backend/migrations/006_worker_reliability.sql
          python backend/scripts/upgrade_strategy_schema.py

      - name: Queue successor block
        id: queue-successor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run bot-worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f research_mode=cycle -f block_cycles=8 && exit 0
            sleep 10
          done
          exit 1

      - name: Run one paper-trading cycle
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
          BLOCK_CYCLES: ${{ inputs.block_cycles || '8' }}
        run: python backend/scripts/run_worker_block.py --cycles "$BLOCK_CYCLES" --timeout-seconds 600

      - name: Retry successor dispatch after the block
        if: always() && steps.queue-successor.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            gh workflow run bot-worker.yml --repo "$GITHUB_REPOSITORY" --ref main -f research_mode=cycle -f block_cycles=8 && exit 0
            sleep 30
          done
          exit 1

  run-research:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.research_mode != 'cycle' && inputs.research_mode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: trademerc-database-writer
      cancel-in-progress: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Run manual research task
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
          RESEARCH_MODE: ${{ inputs.research_mode }}
          RESEARCH_DAYS: ${{ inputs.research_days || '30' }}
        run: |
          cd backend
          python -m scripts.run_research "$RESEARCH_MODE" --days "$RESEARCH_DAYS"
