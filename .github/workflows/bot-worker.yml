name: TRADEMERC ML Trading Bot Worker

on:
  schedule:
    - cron: '*/15 * * * *'  # Aligned with the 15m strategy timeframe
  workflow_dispatch:        # Manual trigger button
    inputs:
      research_mode:
        description: 'cycle, backfill, backtest o train'
        required: false
        default: 'cycle'
      research_days:
        description: 'Días para backfill o backtest (máximo 90/365)'
        required: false
        default: '30'

concurrency:
  group: trademerc-paper-research
  cancel-in-progress: false

jobs:
  run-bot-scan:
    if: github.event_name == 'schedule' || inputs.research_mode == 'cycle' || inputs.research_mode == ''
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run one paper-trading cycle
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.abspath('backend'))

          from app import create_app
          from worker.bot_runner import run_bot_loop

          print('Executing one automated paper-trading cycle...')
          if not run_bot_loop(create_app(), max_cycles=1):
              raise SystemExit('The paper-trading cycle did not complete with full coverage.')
          print('Paper-trading cycle finished cleanly.')
          PY

  run-research:
    if: github.event_name == 'workflow_dispatch' && inputs.research_mode != 'cycle' && inputs.research_mode != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run manual research task
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
          RESEARCH_MODE: ${{ inputs.research_mode }}
          RESEARCH_DAYS: ${{ inputs.research_days || '30' }}
        run: |
          cd backend
          python -m scripts.run_research "$RESEARCH_MODE" --days "$RESEARCH_DAYS"
