name: TRADEMERC ML Trading Bot Worker

on:
  schedule:
    - cron: '*/15 * * * *'  # Aligned with the 15m strategy timeframe
  workflow_dispatch:        # Manual trigger button
    inputs:
      research_mode:
        description: 'cycle, backfill, backtest o train'
        required: false
        default: 'cycle'
      research_days:
        description: 'Días para backfill o backtest (máximo 90/365)'
        required: false
        default: '30'

concurrency:
  group: trademerc-paper-research
  cancel-in-progress: false

jobs:
  run-bot-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run one paper-trading cycle
        env:
          DB_USER: '3RWNAdLev5dv3er.root'
          DB_PASSWORD: 'VSGF3kkVfo4CEIu9'
          DB_HOST: 'gateway01.us-east-1.prod.aws.tidbcloud.com'
          DB_PORT: '4000'
          DB_NAME: 'trademerc_db'
          RESEARCH_MODE: ${{ inputs.research_mode || 'cycle' }}
          RESEARCH_DAYS: ${{ inputs.research_days || '30' }}
        run: |
          python - <<'PY'
          import os
          import sys

          sys.path.insert(0, os.path.abspath('backend'))

          from app import create_app
          from worker.bot_runner import run_bot_loop

          mode = os.environ['RESEARCH_MODE']
          if mode == 'cycle':
              print('Executing one automated paper-trading cycle...')
              if not run_bot_loop(create_app(), max_cycles=1):
                  raise SystemExit('No public market data was received; failing the cycle.')
              print('Paper-trading cycle finished cleanly.')
          else:
              from scripts.run_research import main
              sys.argv = ['run_research.py', mode, '--days', os.environ['RESEARCH_DAYS']]
              main()
          PY
