name: TRADEMERC Health Monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: trademerc-health-monitor
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify real worker health
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 30 https://trade-merc.vercel.app/api/health)"
          HEALTH_RESPONSE="$response" python - <<'PY'
          import json
          import os

          health = json.loads(os.environ['HEALTH_RESPONSE'])
          if health.get('overall_status') != 'HEALTHY':
              raise SystemExit(f"Production is not healthy: {health}")
          components = {item['component']: item for item in health.get('components', [])}
          worker = components.get('bot_worker', {})
          if worker.get('status') != 'HEALTHY':
              raise SystemExit(f"Worker is not healthy: {worker}")
          print('TRADEMERC production heartbeat is current.')
          PY
